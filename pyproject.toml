[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cronpypeline"
version = "0.1.0"
description = "A Python library for building cron-friendly, stateful, multi-stage agentic pipelines driven by JSON configuration."
readme = "PRD.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Wouter"}]
keywords = ["cron", "pipeline", "agentic", "automation", "orchestration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
pydantic = ["pydantic>=2.0"]

[project.scripts]
cronpypeline = "cronpypeline.cli:main"

[tool.setuptools.packages.find]
include = ["cronpypeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
